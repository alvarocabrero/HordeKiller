; Engine settings for HordeKiller. Lines starting with ';' are comments.

[/Script/EngineSettings.GameMapsSettings]
; Game mode used by every map that does not set its own. It runs the waves and selects the player and HUD classes.
GlobalDefaultGameMode=/Script/HordeKiller.HordeKillerGameMode
; Engine template map (sky and lighting). The game mode builds the arena on top of it at runtime.
; EditorStartupMap is what the editor opens; GameDefaultMap is what the game loads on start.
EditorStartupMap=/Engine/Maps/Templates/Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default

[/Script/Engine.Engine]
; Standard redirects written by the engine's blank C++ project template, pointing its placeholder name at this module.
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/HordeKiller")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/HordeKiller")

[/Script/Engine.RendererSettings]
; Unreal Engine 5 rendering defaults: Lumen global illumination (1) and reflections (1), virtual shadow maps,
; and the mesh distance fields that Lumen's software ray tracing relies on.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Render with DirectX 12, the default for new Unreal Engine 5 projects and required by virtual shadow maps.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
