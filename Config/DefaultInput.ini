; Input settings for HordeKiller.

[/Script/Engine.InputSettings]
; Use the Enhanced Input classes for player input. The character casts its input component to
; UEnhancedInputComponent, so these two lines are required for the controls to work.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
